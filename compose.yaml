services:
  database:
    image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    environment:
      POSTGRES_DB: ${DATABASE_DB:-contract_first}
      POSTGRES_USER: ${DATABASE_USER:-contract_first}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-mjga-local-development-only}
    volumes: ["${DATABASE_STORE:-contract-first-postgresql}:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
  server:
    build: { context: ./apps/server }
    environment:
      DATABASE_DB: ${DATABASE_DB:-contract_first}
      DATABASE_USER: ${DATABASE_USER:-contract_first}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-mjga-local-development-only}
      DATABASE_HOST_PORT: database:5432
      MANAGEMENT_SERVER_ADDRESS: 0.0.0.0
    depends_on:
      database: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8081/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    environment:
      PUBLIC_APP_NAME: ${PUBLIC_APP_NAME:-Contract First Scaffold}
      SERVER_ORIGIN: server:8080
    depends_on:
      server: { condition: service_healthy }
    ports: ["${WEB_EXPOSE_PORT:-3000}:8080"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  contract-first-postgresql:
